[project]
name = "rethinking-tta"
version = "0.1.0"
description = "Analisis Cost-Effectiveness Test-Time Augmentation pada Klasifikasi Citra di Bawah Distribution Shift"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "lightning>=2.2",
]

[project.optional-dependencies]
# FLOPs counting (fvcore) and GPU energy sampling (pynvml) for cost-effectiveness metrics.
# Install with: uv sync --extra metrics
metrics = [
    "fvcore>=0.1.5",
    "pynvml>=11.5",
]

[tool.uv]
package = false

[tool.uv.sources]
# Pin torch/torchvision to the PyTorch CUDA 12.6 wheel index on Linux/Windows
# (matches https://pytorch.org/get-started/locally/ --index-url .../whl/cu126).
# Falls back to PyPI (CPU-only) on macOS, which has no CUDA wheels.
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
